name: Build APK with Android SDK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create Android project
        run: |
          mkdir MyApp
          cd MyApp
          # 生成基本 Android 项目结构
          echo "android { namespace 'com.example.calc' }" > build.gradle
          mkdir -p src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">化验计算器</string></resources>' > src/main/res/values/strings.xml
          # 生成 AndroidManifest.xml
          mkdir -p src/main
          cat > src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.calc">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true">
                  <activity
                      android:name="android.app.Activity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Copy web files to assets
        run: |
          mkdir -p MyApp/src/main/assets
          cp -r *.html *.json *.png *.js MyApp/src/main/assets/ 2>/dev/null || true
          # 确保 index.html 存在
          ls MyApp/src/main/assets/

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: |
          cd MyApp
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyApp
          path: MyApp/build/outputs/apk/debug/*.apk