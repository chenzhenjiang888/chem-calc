name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate APK using PWABuilder CLI
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            mcr.microsoft.com/pwabuilder/cli \
            pwabuilder package -p android -o /app/output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyApp
          path: ./output/*.apk