name: Deploy Pages & Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时运行网页部署和APK打包
jobs:
  # 网页自动部署
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

  # APK 打包
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate APK with PWABuilder Action
        uses: pwabuilder/github-action@v1
        with:
          platform: android
          output-path: ./output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyApp
          path: ./output/*.apk