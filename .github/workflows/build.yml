name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate APK with PWABuilder Action
        uses: pwabuilder/github-action@v1
        with:
          platform: android
          output-path: ./output
          # 关键：指定您的 manifest 文件路径
          manifest-path: ./manifest.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyApp
          path: ./output/*.apk